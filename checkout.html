<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — Atelier Noir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="nav">
  <div class="wrap">
    <a href="index.html" class="brand">Atelier Noir</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Collection</a></li>
      <li><a href="cart.html" class="cart-link">Cart <span id="cart-badge" class="cart-badge">0</span></a></li>
      <li><a href="checkout.html" class="active">Checkout</a></li>
    </ul>
    <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
  </div>
</nav>

<section class="wrap">
  <div class="section-head" style="padding-top:56px; margin-bottom:0;">
    <div>
      <span class="kicker">Last step</span>
      <h2>Checkout</h2>
    </div>
  </div>

  <div class="checkout-wrap">
    <form id="checkout-form" novalidate>
      <div class="form-field">
        <label for="customer_name">Customer name</label>
        <input type="text" id="customer_name" name="customer_name" required autocomplete="name">
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <div class="form-field">
        <label for="phone">Phone number</label>
        <input type="tel" id="phone" name="phone" required autocomplete="tel">
      </div>
      <div class="form-field">
        <label for="address">Delivery address</label>
        <textarea id="address" name="address" required autocomplete="street-address"></textarea>
      </div>
      <button type="submit" class="btn btn-dark" id="submit-order">Submit order</button>
      <p class="form-msg" id="form-msg"></p>
    </form>

    <aside class="order-summary">
      <h3>Order summary</h3>
      <div id="order-summary-lines"></div>
    </aside>
  </div>
</section>

<footer>
  <div class="wrap" style="width:100%; display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px;">
    <span>&copy; 2026 Atelier Noir — Graduation Project</span>
    <span>Built with n8n · Google Sheets · Telegram</span>
  </div>
</footer>

<div id="chatbot-placeholder" title="Chat with us">&#128172;</div>

<script src="script.js"></script>
</body>
</html>
